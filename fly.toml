# fly.toml app configuration file generated for hikers-inventory on 2026-05-04T15:20:29-10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hikers-inventory'
primary_region = 'ord'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
